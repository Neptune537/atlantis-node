[workspace]
resolver = "2"
members = [
    "crates/atlantis_protocol",
    "crates/tide_ledger",
    "crates/home_node",
    "crates/ai_gate",
    "crates/solana_programs",
    "crates/olympus",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Atlantis & Kuroshio Gyre Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
sha2 = "0.10"
tracing = "0.1"
sysinfo = "0.33"
ratatui = "0.28"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
